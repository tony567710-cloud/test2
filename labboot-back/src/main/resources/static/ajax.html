<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax</title>
</head>
<body>
    <button onclick="callFind()">find</button>
    <button onclick="callFindById()">findById</button>
    <button onclick="callCreate()">create</button>
    <button onclick="callModify()">modify</button>
    <button onclick="callRemove()">remove</button>
    <script src="https://unpkg.com/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <script src="https://unpkg.com/axios@1.20.0/dist/axios.min.js"></script>
    <script>
        function callFind() {
            Swal.fire({
                title: "執行中......",
                allowOutsideClick: false,
                showConfirmButton: false,
            });
            const body = {
                "start": 0,
                "rows": 3,
                "sort": "id",
                "dir": false
            };
            axios.post("http://localhost:8080/ajax/pages/products/find", body, {
                headers: {
                    'Authorization': 'Bearer ??????????????????'
                }
            }).then(function(response) {
                console.log("response", response);

            }).catch(function(error) {
                Swal.fire({
                    icon: 'error',
                    title: '錯誤：'+error,
                });
            });
        }
        function callFindById() {
            Swal.fire({
                title: "執行中......",
                allowOutsideClick: false,
                showConfirmButton: false,
            });
            axios.get("http://localhost:8080/ajax/pages/products/103").then((response) => {
                console.log("response", response);

            }).catch((error) => {
                Swal.fire({
                    icon: 'error',
                    title: '錯誤：'+error,
                });
            });
        }
        async function callCreate() {
            Swal.fire({
                title: "執行中......",
                allowOutsideClick: false,
                showConfirmButton: false,
            });
            const body = {
                "id": 103,
                "name": "hahaha",
                "price": 1.23,
                "make": "2025-08-04",
                "expire": 45
            };
            try {
                const response = await axios.post("http://localhost:8080/ajax/pages/products", body);
                if(response.data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: response.data.message,
                    });
                } else {
                    Swal.fire({
                        icon: 'warning',
                        title: response.data.message,
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: '錯誤：'+error,
                });
            }
        }
        async function callModify() {
            Swal.fire({
                title: "執行中......",
                allowOutsideClick: false,
                showConfirmButton: false,
            });
            const body = {
                "id": 103,
                "name": "hehehe",
                "price": 5.6,
                "make": "2024-04-30",
                "expire": 7
            };
            try {
                const response = await axios.put(`http://localhost:8080/ajax/pages/products/${body.id}`, body);
                if(response.data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: response.data.message,
                    });
                } else {
                    Swal.fire({
                        icon: 'warning',
                        title: response.data.message,
                    });
                }
            } catch(error) {
                Swal.fire({
                    icon: 'error',
                    title: '錯誤：'+error,
                });
            }
        }
        async function callRemove() {
            const result = await Swal.fire({
                icon: 'question',
                title: "確定要刪除嗎？",
                showDenyButton: true,
            });
            if(result.isConfirmed) {
                try {
                    const response = await axios.delete("http://localhost:8080/ajax/pages/products/103");
                    if(response.data.success) {
                        Swal.fire({
                            icon: 'success',
                            title: response.data.message,
                        });
                    } else {
                        Swal.fire({
                            icon: 'warning',
                            title: response.data.message,
                        });
                    }
                } catch(error) {
                    Swal.fire({
                        icon: 'error',
                        title: '錯誤：'+error,
                    });
                }
            }
        }
    </script>
</body>
</html>
