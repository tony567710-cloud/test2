    <button onclick="doClick()">XMLHttpRequest</button>
    <script>
        var xhr = new XMLHttpRequest();
        function doClick() {
            console.log("doClick() begin");
            xhr.open("GET", "http://localhost:8080/ajax/pages/products/1");
            xhr.send();
            console.log("doClick() end");
            if(xhr.status===200) {
                console.log("....");
            }
        }
    </script>
