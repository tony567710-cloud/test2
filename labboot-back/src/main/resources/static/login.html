<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <h3>登入</h3>
        <table>
            <tbody>
                <tr>
                    <td>帳號：</td>
                    <td><input type="text" name="username" onblur="check()" onfocus="doFocus()"></td>
                    <td><span class="error"></span></td>
                </tr>
                
                <tr>
                    <td>密碼：</td>
                    <td><input type="text" name="password"></td>
                    <td></td>
                </tr>
                <tr>
                    <td> </td>
                    <td align="right">
                        <button type="button" class="btn btn-primary" onclick="login()">登入</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="https://unpkg.com/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <script src="https://unpkg.com/axios@1.20.0/dist/axios.min.js"></script>
    <script>
        function doFocus() {
            document.querySelector("span[class='error']").innerHTML = "";
        }
        async function check() {
            const username = document.querySelector("input[name='username']").value;
            if(username!="") {
                try {
                    const response = await axios.get(`http://localhost:8080/ajax/secure/check/${username}`);
                    console.log("response", response);
                    document.querySelector("span[class='error']").innerHTML = response.data;
                } catch(error) {
                    console.log("error", error);
                    Swal.fire({
                        title: "錯誤:"+ error.message,
                        icon: "error"
                    });
                }
            }
        }
        async function login() {
            const username = document.querySelector("input[name='username']").value;
            const password = document.querySelector("input[name='password']").value;
            const body = {
                "username": username,
                password
            };
            try {
                const response = await axios.post("http://localhost:8080/ajax/secure/login", body);
                console.log("response", response);
                if(response.data.success) {
                    await Swal.fire({
                        title: response.data.message,
                        icon: "success"
                    });
                    window.location.href="http://localhost:8080/ajax.html";
                } else {
                    Swal.fire({
                        title: response.data.message,
                        icon: "warning"
                    });
                }
            } catch(error) {
                console.log("error", error);
                Swal.fire({
                    title: "錯誤:"+ error.message,
                    icon: "error"
                });
            }
        }
    </script>
</body>
</html>
